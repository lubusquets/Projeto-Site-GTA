<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
    <script src="scripts.js" defer></script>
</head>

<body>
    <p class="nome">Lucia</p>
    <img class="personagem" src="imagens/lucia.png" alt="Lucia">

    <div class="textos">

        <p class="etiqueta">Selecione o seu personagem</p>
        <h1>Não é só <br> um jogo</h1>
        <p class="texto-apoio">Escolha uma lenda de Dev City ou tire uma selfie e vire uma. </p>

    </div>

    <div class="menu">


        <button class="avatar selecionado" type="button" data-nome="Lucia" data-imagem="imagens/lucia.png" aria-label="Selecionar Lucia" aria-pressed="true">
            <img src="imagens/lucia.png" alt="">
        </button>

        <button class="avatar" type="button" data-nome="Jason" data-imagem="imagens/jason.png" aria-label="Selecionar Jason" aria-pressed="false">
            <img src="imagens/jason.png" alt="">
        </button>

        <button class="avatar" type="button" data-nome="CJ" data-imagem="imagens/cj.png" aria-label="Selecionar CJ" aria-pressed="false">
            <img src="imagens/cj.png" alt="">
        </button>

        <button class="voce" type="button" aria-label="Tirar selfie do personagem">📸</button>


    </div>



    <div id="camera-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:999; flex-direction:column; align-items:center; justify-content:center; gap:20px;">
    <video id="video" autoplay playsinline style="width:90%; max-width:400px; border-radius:20px; transform: scaleX(-1);"></video>
    <div style="display:flex; gap:15px;">
        <button id="btn-tirar-foto" style="padding:15px 30px; border-radius:50px; background:#ffd319; border:none; font-family:Bangers; font-size:20px; cursor:pointer;">TIRAR FOTO</button>
        <button id="btn-fechar-camera" style="padding:15px 30px; border-radius:50px; background:#fff; border:none; font-family:Bangers; font-size:20px; cursor:pointer;">FECHAR</button>
    </div>
</div>
<canvas id="canvas" style="display:none;"></canvas>




</body>

</html>
